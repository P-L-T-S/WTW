services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wtw-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Wtw@Dev2026!"
    ports:
      - "1433:1433"
    volumes:
      - wtw-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  wtw-sqlserver-data:
